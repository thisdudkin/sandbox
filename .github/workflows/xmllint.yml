name: xmllint
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  xmllint:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: delb-xml/xmllint-action@00e573989faa2a44d40c255c84a47873c6ef626d
        with:
          root_folder: .
          file_pattern: "*.xml"
