name: XML Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint XML files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6

      - name: Run xmllint
        uses: delb-xml/xmllint-action@00e573989faa2a44d40c255c84a47873c6ef626d  # 0.2
        with:
          root_folder: .
          file_pattern: "*.xml"
